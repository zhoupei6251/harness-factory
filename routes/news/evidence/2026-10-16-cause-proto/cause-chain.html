<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* cause · 箭头链版 —— 探针（内容为虚构排版样本）。
         要验的东西：箭头 + 「导致」二字，是不是让画面替我们断言了一件正文没证的因果。
         法则 5 的第三个方向：① 别画假比例条 ② 别用并置暗示并存 ③ 别用箭头暗示因果。 */
      @font-face {
        font-family: "HF CJK";
        src: local("Noto Sans SC"), local("Source Han Sans SC"),
             local("Noto Sans CJK SC"), local("Microsoft YaHei"), local("PingFang SC");
        font-weight: 100 900;
      }
      html, body { margin: 0; background: #0a0a0d; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        container-type: size; background: #0a0a0d; color: #f5f0e8;
        font-family: "HF CJK", sans-serif;
      }
      .clip { position: absolute; inset: 0; }
      .cs-kicker {
        position: absolute; left: 6cqw; top: 6cqh;
        background: #ffffff; color: #e85d5d;
        font-family: "JetBrains Mono", monospace; font-size: 2.6cqw; font-weight: 700;
        letter-spacing: .16em; padding: .85cqh 1.7cqw; transform-origin: 0% 50%;
      }
      .cs-title { position: absolute; left: 6cqw; top: 13cqh; font-size: 7.2cqw;
                  font-weight: 900; line-height: 1.18 }
      .cs-rule { position: absolute; left: 6cqw; top: 24.5cqh; width: 18cqw; height: .55cqh;
                 background: #c0392b; transform-origin: 0% 50% }
      .cs-chain { position: absolute; left: 6cqw; right: 6cqw; top: 30cqh;
                  display: flex; flex-direction: column; gap: 0 }
      .cs-step { display: grid; grid-template-columns: 7cqw 1fr; column-gap: 2.6cqw;
                 align-items: center; padding: 1.8cqh 0 }
      .cs-no { font-family: "League Gothic", sans-serif; font-size: 5.6cqw; line-height: 1;
               color: rgba(245,240,232,0.30) }
      .cs-step:first-child .cs-no { color: #e85d5d }
      .cs-txt { font-size: 4.0cqw; line-height: 1.35 }
      /* 箭头 + 「导致」标签 —— 这一格就是本探针要审的东西 */
      .cs-link { display: grid; grid-template-columns: 7cqw 1fr; column-gap: 2.6cqw;
                 align-items: center; height: 6.4cqh }
      .cs-arrow { font-family: "League Gothic", sans-serif; font-size: 4.4cqw; line-height: 1;
                  color: #c0392b; text-align: center }
      .cs-because { font-family: "JetBrains Mono", monospace; font-size: 2.3cqw;
                    letter-spacing: .14em; color: #e85d5d }
      .cs-probe { position: absolute; right: 6cqw; top: 6.4cqh;
                  font-family: "JetBrains Mono", monospace; font-size: 2.0cqw;
                  color: rgba(245,240,232,0.40); letter-spacing: .1em }
      .cs-title, .cs-txt, .cs-kicker {
        text-shadow: 0 1px 3px rgba(0,0,0,.7), 0 0 1px rgba(0,0,0,.5) }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="cause-proto-chain"
         data-width="1080" data-height="1920" data-duration="5">
      <div class="clip" data-start="0" data-duration="5" data-track-index="1"
           data-width="1080" data-height="1920">
        <div class="cs-kicker" id="kb">科普 · 为什么</div>
        <div class="cs-title" id="tt">大巴又坐满了</div>
        <div class="cs-rule" id="rl"></div>
        <div class="cs-probe">探针·内容为虚构·请勿发布</div>
        <div class="cs-chain" id="ch">
          <div class="cs-step"><div class="cs-no">01</div><div class="cs-txt">高铁成网，大巴客源流失</div></div>
          <div class="cs-link"><div class="cs-arrow">↓</div><div class="cs-because">导致</div></div>
          <div class="cs-step"><div class="cs-no">02</div><div class="cs-txt">客运降价、站点搬进地铁口</div></div>
          <div class="cs-link"><div class="cs-arrow">↓</div><div class="cs-because">于是</div></div>
          <div class="cs-step"><div class="cs-no">03</div><div class="cs-txt">短途乘客回流，班次加密</div></div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kb", { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, .1);
      tl.fromTo("#rl", { scaleX: 0 }, { scaleX: 1, duration: .5, ease: "power2.out" }, .3);
      tl.fromTo("#tt", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .45 }, .45);
      tl.fromTo(".cs-step", { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: .42, stagger: .3, ease: "power2.out" }, .8);
      tl.fromTo(".cs-link", { opacity: 0 },
        { opacity: 1, duration: .3, stagger: .3 }, 1.05);
      tl.to("#ch", { yPercent: -1.2, duration: 2.6, ease: "none" }, 2.3);
      window.__timelines["cause-proto-chain"] = tl;
    </script>
  </body>
</html>
