<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* rank · 带量级条版 —— 版式探针（数据是造的，屏上明写「探针·请勿发布」）。
         要回答的问题：TOP-N 排行榜里那条 bar 值不值得它的诚实负担。
         法则 5（frame.md §3）：源数据没有诚实分母时不画比例条 —— 旧 probe 的 bar
         永远满格就是假数据。所以这里的 bar 一律 **相对第一名**，并且把这句标出来；
         不标就等于让观众把"相对第一"读成"占总量百分比"。 */
      @font-face {
        font-family: "HF CJK";
        src: local("Noto Sans SC"), local("Source Han Sans SC"),
             local("Noto Sans CJK SC"), local("Microsoft YaHei"), local("PingFang SC");
        font-weight: 100 900;
      }
      html, body { margin: 0; background: #0a0a0d; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        container-type: size; background: #0a0a0d; color: #f5f0e8;
        font-family: "HF CJK", sans-serif;
      }
      .clip { position: absolute; inset: 0; }
      .rk-head { position: absolute; left: 6cqw; top: 6cqh; display: flex; flex-direction: column; gap: 2.2cqh }
      .rk-kicker {
        align-self: flex-start; background: #ffffff; color: #e85d5d;
        font-family: "JetBrains Mono", monospace; font-size: 2.6cqw; font-weight: 700;
        letter-spacing: .16em; padding: .85cqh 1.7cqw; transform-origin: 0% 50%;
      }
      .rk-title { font-size: 7.6cqw; font-weight: 900; line-height: 1.18; letter-spacing: -.01em }
      .rk-rule { width: 18cqw; height: .55cqh; background: #c0392b; transform-origin: 0% 50% }
      /* 行区：底部同样让开 20cqh 字幕禁入区（法则 1） */
      .rk-rows { position: absolute; left: 6cqw; right: 6cqw; top: 34cqh; bottom: 22cqh;
                 display: flex; flex-direction: column; justify-content: space-between }
      .rk-row { display: grid; grid-template-columns: 9cqw 1fr; grid-template-rows: auto auto;
                column-gap: 2.4cqw; align-items: center }
      .rk-no { grid-row: 1 / span 2; font-family: "League Gothic", sans-serif;
               font-size: 7.4cqw; line-height: 1; color: rgba(245,240,232,0.34) }
      .rk-row:nth-child(1) .rk-no { color: #e85d5d }
      .rk-name { font-size: 4.0cqw; font-weight: 700; line-height: 1.2 }
      .rk-val { justify-self: end; font-family: "League Gothic", sans-serif;
                font-size: 5.2cqw; line-height: 1; color: #f5f0e8 }
      .rk-track { grid-column: 2; height: .9cqh; background: rgba(245,240,232,0.12);
                  margin-top: 1.1cqh; overflow: hidden }
      .rk-bar { height: 100%; background: #c0392b; transform-origin: 0% 50% }
      /* bar 的口径必须写在脸上，否则观众按"占总量"读 */
      .rk-basis { position: absolute; left: 6cqw; bottom: 22.6cqh;
                  font-family: "JetBrains Mono", monospace; font-size: 2.0cqw;
                  color: rgba(245,240,232,0.52); letter-spacing: .06em }
      .rk-probe { position: absolute; right: 6cqw; top: 6.4cqh;
                  font-family: "JetBrains Mono", monospace; font-size: 2.0cqw;
                  color: rgba(245,240,232,0.40); letter-spacing: .1em }
      .rk-title, .rk-name, .rk-val, .rk-kicker {
        text-shadow: 0 1px 3px rgba(0,0,0,.7), 0 0 1px rgba(0,0,0,.5) }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="rank-proto-bar"
         data-width="1080" data-height="1920" data-duration="5">
      <div class="clip" data-start="0" data-duration="5" data-track-index="1"
           data-width="1080" data-height="1920">
        <div class="rk-head">
          <div class="rk-kicker" id="kb">城市出行量 TOP5</div>
          <div class="rk-rule" id="rl"></div>
          <div class="rk-title" id="tt">谁把地铁坐满了</div>
        </div>
        <div class="rk-probe">探针·数据为虚构·请勿发布</div>
        <div class="rk-rows" id="rw">
          <div class="rk-row"><div class="rk-no">01</div><div class="rk-name">上海</div>
            <div class="rk-val">1,188万</div><div class="rk-track"><div class="rk-bar" id="b1"></div></div></div>
          <div class="rk-row"><div class="rk-no">02</div><div class="rk-name">北京</div>
            <div class="rk-val">1,092万</div><div class="rk-track"><div class="rk-bar" id="b2"></div></div></div>
          <div class="rk-row"><div class="rk-no">03</div><div class="rk-name">广州</div>
            <div class="rk-val">924万</div><div class="rk-track"><div class="rk-bar" id="b3"></div></div></div>
          <div class="rk-row"><div class="rk-no">04</div><div class="rk-name">深圳</div>
            <div class="rk-val">871万</div><div class="rk-track"><div class="rk-bar" id="b4"></div></div></div>
          <div class="rk-row"><div class="rk-no">05</div><div class="rk-name">成都</div>
            <div class="rk-val">742万</div><div class="rk-track"><div class="rk-bar" id="b5"></div></div></div>
        </div>
        <div class="rk-basis" id="bs">条长 = 相对第一名，非占总量比例</div>
      </div>
    </div>
    <script>
      const MAX = 1188;
      const vals = { b1: 1188, b2: 1092, b3: 924, b4: 871, b5: 742 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kb", { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, .1);
      tl.fromTo("#rl", { scaleX: 0 }, { scaleX: 1, duration: .5, ease: "power2.out" }, .3);
      tl.fromTo("#tt", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .45 }, .45);
      // bar 用 scaleX 且**按真实比值**算 —— 满格只在第一名，画不出假满格
      Object.entries(vals).forEach(([id, v], i) => {
        tl.fromTo("#" + id, { scaleX: 0 },
          { scaleX: v / MAX, duration: .6, ease: "power2.out" }, .8 + i * .12);
      });
      tl.fromTo(".rk-row", { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: .4, stagger: .1, ease: "power2.out" }, .7);
      tl.fromTo("#bs", { opacity: 0 }, { opacity: 1, duration: .5 }, 1.6);
      tl.to("#rw", { yPercent: -1.4, duration: 3.2, ease: "none" }, 1.8);
      window.__timelines["rank-proto-bar"] = tl;
    </script>
  </body>
</html>
