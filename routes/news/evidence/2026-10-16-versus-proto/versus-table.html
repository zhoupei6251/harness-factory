<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* versus · 属性表 + 不对称版 —— 与 split/index.html 同一份数据。
         两处设计差别都是冲着"并置等宽 = 暗示同时有效"这个风险来的：
           ① 加**属性列**：明确"只比这三件事"，而不是两堆话摆在一起让观众自己配；
           ② **不对称**：旧列弱化 + 挂「已废止」，新列强化 —— 画面不再声称两者并存。
         旧值一律不划删除线（划了等于替观众判定"它错了"，那是评论不是事实）。 */
      @font-face {
        font-family: "HF CJK";
        src: local("Noto Sans SC"), local("Source Han Sans SC"),
             local("Noto Sans CJK SC"), local("Microsoft YaHei"), local("PingFang SC");
        font-weight: 100 900;
      }
      html, body { margin: 0; background: #0a0a0d; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        container-type: size; background: #0a0a0d; color: #f5f0e8;
        font-family: "HF CJK", sans-serif;
      }
      .clip { position: absolute; inset: 0; }
      .vs-kicker {
        position: absolute; left: 6cqw; top: 6cqh;
        background: #ffffff; color: #e85d5d;
        font-family: "JetBrains Mono", monospace; font-size: 2.6cqw; font-weight: 700;
        letter-spacing: .16em; padding: .85cqh 1.7cqw; transform-origin: 0% 50%;
      }
      .vs-title { position: absolute; left: 6cqw; top: 13cqh; font-size: 7.2cqw;
                  font-weight: 900; line-height: 1.18 }
      .vs-rule { position: absolute; left: 6cqw; top: 24.5cqh; width: 18cqw; height: .55cqh;
                 background: #c0392b; transform-origin: 0% 50% }
      .vs-table { position: absolute; left: 6cqw; right: 6cqw; top: 29cqh; bottom: 26cqh;
                  display: flex; flex-direction: column; justify-content: space-between }
      .vs-thead, .vs-trow { display: grid; grid-template-columns: 22cqw 1fr 1fr; column-gap: 2.6cqw }
      .vs-thead { font-family: "JetBrains Mono", monospace; font-size: 2.5cqw;
                  letter-spacing: .12em; color: rgba(245,240,232,0.5) }
      .vs-thead .th-new { color: #e85d5d }
      .vs-trow { align-items: start; padding-top: 1.9cqh;
                 border-top: 1px solid rgba(245,240,232,0.12) }
      .vs-attr { font-size: 3.1cqw; color: #b0b0b0; line-height: 1.35 }
      .vs-old { font-size: 3.7cqw; color: rgba(245,240,232,0.48); line-height: 1.35 }
      .vs-new { font-size: 3.9cqw; font-weight: 700; color: #f5f0e8; line-height: 1.35 }
      /* ② 不对称的核心装置：旧规状态标 —— 没有它，两栏并置就是在说"都还在" */
      .vs-state { position: absolute; left: 6cqw; bottom: 21.4cqh;
                  font-family: "JetBrains Mono", monospace; font-size: 2.3cqw;
                  letter-spacing: .1em; color: #0a0a0d; background: #b0b0b0;
                  padding: .6cqh 1.4cqw }
      .vs-state b { color: #0a0a0d }
      .vs-effective { position: absolute; right: 6cqw; bottom: 21.6cqh;
                      font-family: "JetBrains Mono", monospace; font-size: 2.2cqw;
                      color: rgba(245,240,232,0.55); letter-spacing: .06em }
      .vs-probe { position: absolute; right: 6cqw; top: 6.4cqh;
                  font-family: "JetBrains Mono", monospace; font-size: 2.0cqw;
                  color: rgba(245,240,232,0.40); letter-spacing: .1em }
      .vs-title, .vs-new, .vs-old, .vs-attr, .vs-kicker {
        text-shadow: 0 1px 3px rgba(0,0,0,.7), 0 0 1px rgba(0,0,0,.5) }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="versus-proto-table"
         data-width="1080" data-height="1920" data-duration="5">
      <div class="clip" data-start="0" data-duration="5" data-track-index="1"
           data-width="1080" data-height="1920">
        <div class="vs-kicker" id="kb">门诊新规 · 新旧对照</div>
        <div class="vs-title" id="tt">改了什么</div>
        <div class="vs-rule" id="rl"></div>
        <div class="vs-probe">探针·数据为虚构·请勿发布</div>
        <div class="vs-table" id="tb">
          <div class="vs-thead"><span>对比项</span><span class="th-old">旧</span><span class="th-new">新</span></div>
          <div class="vs-trow"><span class="vs-attr">挂号凭证</span><span class="vs-old">单位介绍信</span><span class="vs-new">电子凭证即可</span></div>
          <div class="vs-trow"><span class="vs-attr">取号方式</span><span class="vs-old">现场窗口排队</span><span class="vs-new">线上提前七日</span></div>
          <div class="vs-trow"><span class="vs-attr">退号规则</span><span class="vs-old">当日号源不可退</span><span class="vs-new">提前一日免费退</span></div>
        </div>
        <div class="vs-state" id="st">旧规 <b>已废止</b></div>
        <div class="vs-effective" id="ef">新规自 2026-11-01 施行</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kb", { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, .1);
      tl.fromTo("#tt", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .45 }, .35);
      tl.fromTo("#rl", { scaleX: 0 }, { scaleX: 1, duration: .5, ease: "power2.out" }, .55);
      tl.fromTo(".vs-thead", { opacity: 0 }, { opacity: 1, duration: .35 }, .75);
      tl.fromTo(".vs-trow", { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: .42, stagger: .16, ease: "power2.out" }, .9);
      tl.fromTo("#st", { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: .4, ease: "power2.out" }, 1.7);
      tl.fromTo("#ef", { opacity: 0 }, { opacity: 1, duration: .4 }, 1.9);
      tl.to("#tb", { yPercent: -1.1, duration: 2.8, ease: "none" }, 2.2);
      window.__timelines["versus-proto-table"] = tl;
    </script>
  </body>
</html>
