<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* versus · 等权分屏版 —— 探针（数据虚构）。
         要回答的问题：左右两栏并排，会不会让观众读成"两件事同时成立/等价"？
         政策新旧对照是误导成本最高的一格 —— 旧规已废止，与新规**并置等宽**
         就等于让画面替我们说"现在还是这样"。
         这一版故意做成最"对称"的样子，好把风险暴露出来。 */
      @font-face {
        font-family: "HF CJK";
        src: local("Noto Sans SC"), local("Source Han Sans SC"),
             local("Noto Sans CJK SC"), local("Microsoft YaHei"), local("PingFang SC");
        font-weight: 100 900;
      }
      html, body { margin: 0; background: #0a0a0d; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        container-type: size; background: #0a0a0d; color: #f5f0e8;
        font-family: "HF CJK", sans-serif;
      }
      .clip { position: absolute; inset: 0; }
      .vs-kicker {
        position: absolute; left: 6cqw; top: 6cqh;
        background: #ffffff; color: #e85d5d;
        font-family: "JetBrains Mono", monospace; font-size: 2.6cqw; font-weight: 700;
        letter-spacing: .16em; padding: .85cqh 1.7cqw; transform-origin: 0% 50%;
      }
      .vs-title { position: absolute; left: 6cqw; top: 13cqh; font-size: 7.2cqw;
                  font-weight: 900; line-height: 1.18; max-width: 88cqw }
      .vs-cols { position: absolute; left: 6cqw; right: 6cqw; top: 28cqh; bottom: 22cqh;
                 display: grid; grid-template-columns: 1fr 1fr; column-gap: 3cqw }
      .vs-col { display: flex; flex-direction: column; gap: 2.4cqh }
      .vs-colhead { font-family: "JetBrains Mono", monospace; font-size: 3.0cqw;
                    font-weight: 700; letter-spacing: .1em; padding-bottom: 1.2cqh;
                    border-bottom: .5cqh solid transparent }
      .vs-before .vs-colhead { color: #b0b0b0; border-bottom-color: rgba(176,176,176,0.28) }
      .vs-after  .vs-colhead { color: #e85d5d; border-bottom-color: #c0392b }
      .vs-item { font-size: 3.9cqw; line-height: 1.42 }
      .vs-before .vs-item { color: rgba(245,240,232,0.62) }
      .vs-probe { position: absolute; right: 6cqw; top: 6.4cqh;
                  font-family: "JetBrains Mono", monospace; font-size: 2.0cqw;
                  color: rgba(245,240,232,0.40); letter-spacing: .1em }
      .vs-title, .vs-item, .vs-colhead, .vs-kicker {
        text-shadow: 0 1px 3px rgba(0,0,0,.7), 0 0 1px rgba(0,0,0,.5) }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="versus-proto-split"
         data-width="1080" data-height="1920" data-duration="5">
      <div class="clip" data-start="0" data-duration="5" data-track-index="1"
           data-width="1080" data-height="1920">
        <div class="vs-kicker" id="kb">门诊新规 · 新旧对照</div>
        <div class="vs-title" id="tt">改了什么</div>
        <div class="vs-probe">探针·数据为虚构·请勿发布</div>
        <div class="vs-cols">
          <div class="vs-col vs-before">
            <div class="vs-colhead" id="cb">旧</div>
            <div class="vs-item">需单位介绍信</div>
            <div class="vs-item">现场窗口排队取号</div>
            <div class="vs-item">当日号源不可退</div>
          </div>
          <div class="vs-col vs-after">
            <div class="vs-colhead" id="ca">新</div>
            <div class="vs-item">电子凭证即可</div>
            <div class="vs-item">线上提前七日预约</div>
            <div class="vs-item">提前一日可免费退</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kb", { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power2.out" }, .1);
      tl.fromTo("#tt", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .45 }, .4);
      tl.fromTo("#cb", { opacity: 0 }, { opacity: 1, duration: .4 }, .7);
      tl.fromTo(".vs-before .vs-item", { opacity: 0, x: -22 },
        { opacity: 1, x: 0, duration: .4, stagger: .12, ease: "power2.out" }, .8);
      tl.fromTo("#ca", { opacity: 0 }, { opacity: 1, duration: .4 }, 1.0);
      tl.fromTo(".vs-after .vs-item", { opacity: 0, x: 22 },
        { opacity: 1, x: 0, duration: .4, stagger: .12, ease: "power2.out" }, 1.1);
      tl.to(".vs-cols", { yPercent: -1.2, duration: 3.2, ease: "none" }, 1.8);
      window.__timelines["versus-proto-split"] = tl;
    </script>
  </body>
</html>
