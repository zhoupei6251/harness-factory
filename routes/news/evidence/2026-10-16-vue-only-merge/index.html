<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* news-coral · host 骨架 — 双花括号占位符由 path_b_build.py 填充。
         这里故意不把占位符原样写进注释: String.replace 不认 CSS 注释,
         写了就会把整段挂载标记复制进样式表里 (实测 index.html 出现两份 clip)。
           COMPOSITION_ID  宿主合成 id (与 window.__timelines 的键一致)
           W / H           画布宽高 (px)
           TOTAL           全片秒数 = 各镜时长之和
           SCENES          N 个挂载 clip (每镜一个, 见 README 的挂载片段格式)
           AUDIOS          N 个挂载 audio (每镜配音一条, 0 轨)
         宿主本身不画任何东西: 地面/版式/时间轴全在各 layout 的子合成里。 */
      html,
      body {
        margin: 0;
        background: #1a1a1a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        container-type: size;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* 配音轨不参与版面: 抽出来给零尺寸, 免得它的行盒撑高 #root 把画面顶偏一位。
         时间轴/可见性由 data-start + data-duration 决定, 与 CSS 无关。 */
      audio {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
        pointer-events: none;
      }
    </style>
        <link rel="stylesheet" href="vue/assets/field-a-C-nBYAjC.css">
    <link rel="stylesheet" href="vue/assets/field-a-Ni89-8RF.css">
    <link rel="stylesheet" href="vue/assets/hook-a-BbRLphc_.css">
    <script src="vue/vue.runtime.global.prod.js"></script>
    <script type="module">
      (async () => {
        for (const clip of document.querySelectorAll('[data-vue-mount]')) {
          const compId = clip.dataset.compositionId;
          const bundle = clip.dataset.vueBundle;
          const target = clip.querySelector(':scope > .vue-target');
          if (!target) continue;
          const mod = await import('./vue/' + bundle + '.js');
          mod.mount(clip, compId);
        }
      })();
    </script>

  </head>
  <body>
    <div
      id="root"
      data-composition-id="news"
      data-width="1080"
      data-height="1920"
      data-duration="19.578"
    >
      <div id="shot-1" class="clip" data-composition-id="nc-night-hook__1" data-vue-mount="1" data-vue-bundle="hook-a" style="--c0:#0a0a0d;--c1:#f5f0e8;--c2:#c0392b;--c3:#ffffff;--c4:#e85d5d;--c5:#c0392b;--c6:#ffffff;--c7:#c0392b;--c8:#dcdcdc;--c9:#b0b0b0;--c10:#dcdcdc;" data-variable-values="{&quot;kicker&quot;: &quot;湖南常德&quot;, &quot;headTop&quot;: &quot;42万&quot;, &quot;headBottomLead&quot;: &quot;在账户里躺了&quot;, &quot;headAccent&quot;: &quot;21年&quot;, &quot;support&quot;: &quot;他自己完全不知道&quot;, &quot;imagePath&quot;: &quot;&quot;, &quot;imageCredit&quot;: &quot;&quot;, &quot;slotSeconds&quot;: 6.822}" data-start="0.000" data-duration="6.822222222222222" data-track-index="1" data-width="1080" data-height="1920">        <div class="vue-target"></div>      </div>
      <div id="shot-2" class="clip" data-composition-id="field-news-coral__2" data-vue-mount="1" data-vue-bundle="field-a" style="--c0:#0a0a0d;--c1:#f5f0e8;--c2:#ffffff;--c3:#e85d5d;--c4:#c0392b;--c5:#b0b0b0;--c6:#8a8a8a;--c7:#262627;" data-variable-values="{&quot;kicker&quot;: &quot;要闻速读&quot;, &quot;ghost&quot;: &quot;21年&quot;, &quot;place&quot;: &quot;湖南常德 · 救助站门口&quot;, &quot;title&quot;: &quot;一笔没人算过的账&quot;, &quot;onscreen&quot;: &quot;工龄一直在系统里记着&quot;, &quot;slotSeconds&quot;: 6.378}" data-start="6.822" data-duration="6.377777777777777" data-track-index="1" data-width="1080" data-height="1920">        <div class="vue-target"></div>      </div>
      <div id="shot-3" class="clip" data-composition-id="nc-closer" data-composition-src="compositions/closer.html" data-variable-values="{&quot;kicker&quot;: &quot;怎么办&quot;, &quot;cta&quot;: &quot;查一下&quot;, &quot;ctaAccent&quot;: &quot;社保&quot;, &quot;channel&quot;: &quot;央视新闻&quot;, &quot;imagePath&quot;: &quot;&quot;, &quot;imageCredit&quot;: &quot;&quot;, &quot;slotSeconds&quot;: 6.378}" data-start="13.200" data-duration="6.377777777777777" data-track-index="1" data-width="1080" data-height="1920"></div>

    </div>
    <script>
      window.__timelines["news"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
