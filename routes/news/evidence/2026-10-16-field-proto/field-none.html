<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* field · none 态原型 —— 「画面主导镜」在没有影像时该长什么样。
         设计主张: 无图不是留一个空洞, 而是**让事实本身当画面主体**
         (ghosted 巨号数字 + 斜纹地面), 影像只是可选增强。
         色值全部来自 news-coral 的共享 token, 不新造颜色。 */
      @font-face {
        font-family: "HF CJK";
        src: local("Noto Sans SC"), local("Source Han Sans SC"),
             local("Noto Sans CJK SC"), local("Microsoft YaHei"), local("PingFang SC");
        font-weight: 100 900;
      }
      html, body { margin: 0; background: #0a0a0d; }
      #root {
        position: relative; width: 100%; height: 100%;
        overflow: hidden; container-type: size;
        background: #0a0a0d; color: #f5f0e8;
        font-family: "HF CJK", sans-serif;
      }
      .clip { position: absolute; inset: 0; }

      /* 画面区 = 顶部到 62cqh。底部 20cqh 是字幕禁入区(法则 1)，文字带坐在它上面。 */
      .fd-stage {
        position: absolute; left: 0; right: 0; top: 0; height: 62cqh;
        overflow: hidden;
        background:
          repeating-linear-gradient(135deg,
            rgba(232,93,93,0.075) 0 1.6cqw, transparent 1.6cqw 4.2cqw),
          radial-gradient(120% 78% at 50% 8%, rgba(232,93,93,0.16), transparent 62%);
      }
      /* 事实当主体: ghosted 巨号, 12% 墨 —— 与 story 的序号水印同一套语言 */
      .fd-ghost {
        position: absolute; left: 6cqw; top: 12cqh;
        font-family: "League Gothic", sans-serif;
        font-size: 27cqw; line-height: .82; letter-spacing: -.01em;
        color: rgba(245,240,232,0.12);
        white-space: nowrap; pointer-events: none;
      }
      .fd-ghost-sub {
        position: absolute; left: 6.4cqw; top: 36cqh;
        font-size: 3.1cqw; letter-spacing: .22em; color: rgba(245,240,232,0.30);
        font-family: "JetBrains Mono", monospace;
      }
      /* 眉标片: 白片 + 珊瑚字(3.41, 大字号过 AA) —— 片有底色 ⇒ 只做 scaleX 擦入(法则 8) */
      .fd-kicker {
        position: absolute; left: 6cqw; top: 6cqh;
        background: #ffffff; color: #e85d5d;
        font-family: "JetBrains Mono", monospace;
        font-size: 2.7cqw; font-weight: 700; letter-spacing: .16em;
        padding: .9cqh 1.8cqw; transform-origin: 0% 50%;
      }
      /* 文字带: 底边坐在字幕禁入区上方 2cqh */
      .fd-copy {
        position: absolute; left: 6cqw; right: 6cqw; bottom: 22cqh;
        display: flex; flex-direction: column; gap: 2.2cqh;
      }
      .fd-rule { width: 18cqw; height: .55cqh; background: #c0392b; transform-origin: 0% 50% }
      .fd-head {
        font-size: 8.4cqw; font-weight: 900; line-height: 1.2;
        letter-spacing: -.01em; max-width: 88cqw;
      }
      .fd-sub { font-size: 4.1cqw; font-weight: 400; color: #b0b0b0; line-height: 1.45 }
      /* 阴影只给文字，不给装饰层（§3-A：通用 root 子元素阴影会把 12% 水印打成实黑） */
      .fd-head, .fd-sub, .fd-kicker {
        text-shadow: 0 1px 3px rgba(0,0,0,.7), 0 0 1px rgba(0,0,0,.5);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="field-proto-none"
         data-width="1080" data-height="1920" data-duration="5">
      <div class="clip" data-start="0" data-duration="5" data-track-index="1"
           data-width="1080" data-height="1920">
        <div class="fd-stage">
          <div class="fd-ghost" id="g">1000万</div>
          <div class="fd-ghost-sub" id="gs">浙江宁波 · 鄞州</div>
        </div>
        <div class="fd-kicker" id="kb">现场无影像</div>
        <div class="fd-copy">
          <div class="fd-rule" id="rl"></div>
          <div class="fd-head" id="hd">女儿还没住过一天</div>
          <div class="fd-sub" id="sb">精装被整屋拆回毛坯</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // 动量预算(§4): 入场 ≤1.5s，之后持续漂移，不留静止尾巴
      tl.fromTo("#kb", { scaleX: 0 }, { scaleX: 1, duration: .5, ease: "power2.out" }, .1);
      tl.fromTo("#g",  { opacity: 0, yPercent: 6 }, { opacity: 1, yPercent: 0, duration: .9, ease: "power2.out" }, .15);
      tl.fromTo("#gs", { opacity: 0 }, { opacity: 1, duration: .6 }, .7);
      tl.fromTo("#rl", { scaleX: 0 }, { scaleX: 1, duration: .55, ease: "power2.out" }, .8);
      tl.fromTo("#hd", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .5 }, .95);
      tl.fromTo("#sb", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .45 }, 1.2);
      tl.to("#g",  { yPercent: -2.2, duration: 3.6, ease: "none" }, 1.4);
      tl.to(".fd-copy", { yPercent: -1.2, duration: 3.6, ease: "none" }, 1.4);
      window.__timelines["field-proto-none"] = tl;
    </script>
  </body>
</html>
