name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-test:
    name: npm test (Node 20.9 / Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pin the declared engines floor, not the dev machine's Node. A gate
      # that only runs on the newest local interpreter cannot protect the
      # contract downstream projects install against.
      - uses: actions/setup-node@v4
        with:
          node-version: 20.9.0
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm test
