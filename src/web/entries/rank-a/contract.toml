# rank · Vue-only 版式契约（带量级条的 TOP-N 榜）
#
# 设计出处：`evidence/2026-10-16-rank-proto.md` —— 结论是**带 bar**，但 bar 的
# 信息增益（梯度）绑着两条诚实负担，两条都在本契约里落成机检，不是写在文档里：
#   ① 条长 = 相对第一名的比值 ⇒ 条目**单位必须一致**（`bars` 声明 → 发射器 `_check_bar_units`）；
#   ② 观众默认把条长读成「占总量百分比」⇒ 屏上必须有口径标注。**它是版式常量，不是稿件
#      变量** —— 能改标签就等于允许「条按相对第一画、字写占总量」这种谎。所以它不进契约的
#      variables，标注由组件自带；`check_component` 见到 bars 声明就要求组件里有 basis 节点。
#
# 容量：探针实测带 bar 时 5 行顶到字幕禁入区边缘，plain 同字号能放 6–7 行 ⇒
# **上限由"带不带 bar"决定，不是"几行好看"决定**。这里定 5 行上限、3 行下限：
# item4*/item5* 声明为 `optional`（尾部可选行，见 vue_contracts），稿件只有 3 条时
# 那两格落空串、组件收行 —— 而不是把 90% 的真实榜单拒之门外。
role = "rank"
variant = "a"
ground = "#0a0a0d"
bars = "itemNValue"

variables = [
  { id = "kicker",   type = "string", label = "眉标", default = "TOP 榜" },
  { id = "title",    type = "string", label = "领句" },
  { id = "item1Label", type = "string", label = "第1名条目" },
  { id = "item1Value", type = "string", label = "第1名数值" },
  { id = "item2Label", type = "string", label = "第2名条目" },
  { id = "item2Value", type = "string", label = "第2名数值" },
  { id = "item3Label", type = "string", label = "第3名条目" },
  { id = "item3Value", type = "string", label = "第3名数值" },
  { id = "item4Label", type = "string", label = "第4名条目" },
  { id = "item4Value", type = "string", label = "第4名数值" },
  { id = "item5Label", type = "string", label = "第5名条目" },
  { id = "item5Value", type = "string", label = "第5名数值" },
  { id = "onscreen", type = "string", label = "屏句（唯一上屏整句，不进配音）" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

optional = ["item4Label", "item4Value", "item5Label", "item5Value"]

[slots]
c0 = "#0a0a0d"   # 地面
c1 = "#f5f0e8"   # 主文字
c2 = "#ffffff"   # 眉标片底
c3 = "#e85d5d"   # 眉标片字（共享强调色）
c4 = "#c0392b"   # 尺 + 条
c5 = "#747474"   # 名次数字（非首位）—— 探针用的 rgba(.34) 实测 2.86:1 不过 3:1，抬到 .45
c6 = "#8a8a8a"   # 口径标注
c7 = "#262627"   # 条轨底（装饰，非文字）

[overrides]
