<!doctype html>
<html lang="zh-CN" data-composition-variables='[
    {"id": "kicker", "type": "string", "label": "眉标", "default": "NEWS"},
    {"id": "title", "type": "string", "label": "小标题", "default": "一个标题"},
    {"id": "ordinal", "type": "string", "label": "镜序", "default": "01"},
    {"id": "item1Label", "type": "string", "label": "第1条标签", "default": "标签一"},
    {"id": "item1Value", "type": "string", "label": "第1条事实", "default": "事实一"},
    {"id": "item2Label", "type": "string", "label": "第2条标签", "default": "标签二"},
    {"id": "item2Value", "type": "string", "label": "第2条事实", "default": "事实二"},
    {"id": "item3Label", "type": "string", "label": "第3条标签", "default": "标签三"},
    {"id": "item3Value", "type": "string", "label": "第3条事实", "default": "事实三"},
    {"id": "slotSeconds", "type": "number", "label": "本镜可见秒数", "default": 4, "min": 1}
  ]'>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
@font-face {
  font-family: "HF CJK";
  src: local("Noto Sans SC"), local("Microsoft YaHei"), local("DengXian");
  font-weight: 100 900;
}

@font-face {
  font-family: "HF Serif CJK";
  src: local("Noto Serif SC"), local("SimSun");
  font-weight: 100 900;
}

#root { position: absolute; inset: 0; overflow: hidden;
  background: #f5efe3;
  color: #1f1b16;
  font-family: "HF CJK", sans-serif;
}

#ew-rail-col { position: absolute; top: 8.5cqh; left: 0;
  width: 100cqw; height: 67.5cqh; }

#ew-rl-rule { position: absolute; top: 0cqh; left: 6cqw; width: 88cqw; height: 0.35cqh; background: #ddd3bf; }


#ew-rl-kicker { position: absolute; top: 4.5cqh; left: 6cqw; max-width: 22.4cqw; background: #B45309; color: #ffffff; font-size: 2.8cqw; font-weight: 900; padding: 0.85cqh 1.9cqw; transform-origin: 0% 50%; }


#ew-rl-title { position: absolute; top: 10.5cqh; left: 6cqw; max-width: 68cqw; font-family: HF Serif CJK, serif; font-size: 6.4cqw; font-weight: 900; line-height: 1.2; letter-spacing: -0.01em; color: #1f1b16; }
.ew-rl-title-ch { display: inline-block; }


#ew-rl-ordinal { position: absolute; top: 4.5cqh; left: 75.79cqw; max-width: 18.21cqw; font-family: Playfair Display, sans-serif; font-size: 16cqw; line-height: 1.12; color: #6b5f4f; }


#ew-rl-spine { position: absolute; top: 25.5cqh; left: 6cqw; right: 92.6cqw; height: 42cqh; background: #B45309; }


#ew-rl-lab1 { position: absolute; top: 27.5cqh; left: 12cqw; max-width: 74cqw; font-family: HF CJK, sans-serif; font-size: 3cqw; font-weight: 400; letter-spacing: 0.12em; line-height: 1.3; color: #6b5f4f; }


#ew-rl-val1 { position: absolute; top: 32.1cqh; left: 12cqw; max-width: 46cqw; font-family: HF Serif CJK, serif; font-size: 5.4cqw; font-weight: 900; line-height: 1.2; letter-spacing: -0.01em; color: #1f1b16; }
.ew-rl-val1-ch { display: inline-block; }


#ew-rl-lab2 { position: absolute; top: 41.5cqh; left: 12cqw; max-width: 74cqw; font-family: HF CJK, sans-serif; font-size: 3cqw; font-weight: 400; letter-spacing: 0.12em; line-height: 1.3; color: #6b5f4f; }


#ew-rl-val2 { position: absolute; top: 46.1cqh; left: 12cqw; max-width: 46cqw; font-family: HF Serif CJK, serif; font-size: 5.4cqw; font-weight: 900; line-height: 1.2; letter-spacing: -0.01em; color: #1f1b16; }
.ew-rl-val2-ch { display: inline-block; }


#ew-rl-lab3 { position: absolute; top: 55.5cqh; left: 12cqw; max-width: 74cqw; font-family: HF CJK, sans-serif; font-size: 3cqw; font-weight: 400; letter-spacing: 0.12em; line-height: 1.3; color: #6b5f4f; }


#ew-rl-val3 { position: absolute; top: 60.1cqh; left: 12cqw; max-width: 46cqw; font-family: HF Serif CJK, serif; font-size: 5.4cqw; font-weight: 900; line-height: 1.2; letter-spacing: -0.01em; color: #1f1b16; }
.ew-rl-val3-ch { display: inline-block; }


      </style>
      <div id="root" data-composition-id="ew-rail" data-hf-primitives="hairline,block-chip,char-rise,giant-numeral,clip-wipe-up,cue-fade" data-width="1080" data-height="1920">
        <div id="ew-rail-col">
          <div id="ew-rl-rule"></div>
          <div id="ew-rl-kicker" data-var-text="kicker"></div>
          <div id="ew-rl-title" data-var-text="title"><span class="ew-rl-title-ch"></span></div>
          <div id="ew-rl-ordinal"><span class="ew-rl-ordinal-value" data-var-text="ordinal"></span></div>
          <div id="ew-rl-spine"></div>
          <div id="ew-rl-lab1" data-var-text="item1Label"></div>
          <div id="ew-rl-val1" data-var-text="item1Value"><span class="ew-rl-val1-ch"></span></div>
          <div id="ew-rl-lab2" data-var-text="item2Label"></div>
          <div id="ew-rl-val2" data-var-text="item2Value"><span class="ew-rl-val2-ch"></span></div>
          <div id="ew-rl-lab3" data-var-text="item3Label"></div>
          <div id="ew-rl-val3" data-var-text="item3Value"><span class="ew-rl-val3-ch"></span></div>
        </div>
      </div>
      <script>
        const vars = window.__hyperframes.getVariables();
        const slot = Number(vars.slotSeconds) || 4;
        const INTRO_END = 1.5;
        const MIN_DRIFT = 0.6;
        const driftStart = Math.max(0, Math.min(INTRO_END, slot - MIN_DRIFT));
        const driftDur = Math.max(MIN_DRIFT, slot - driftStart);
        
        const tl = gsap.timeline({ paused: true });
        const ewRlTitleChars = Array.from(String(vars["title"] || "").trim());
        const ewRlTitleBox = document.getElementById("ew-rl-title");
        ewRlTitleBox.removeAttribute("data-var-text");
        ewRlTitleBox.textContent = "";
        ewRlTitleChars.forEach(function (ch) {
          const ewRlTitleSpan = document.createElement("span");
          ewRlTitleSpan.className = "ew-rl-title-ch";
          ewRlTitleSpan.textContent = ch;
          ewRlTitleBox.appendChild(ewRlTitleSpan);
        });
        const ewRlVal1Chars = Array.from(String(vars["item1Value"] || "").trim());
        const ewRlVal1Box = document.getElementById("ew-rl-val1");
        ewRlVal1Box.removeAttribute("data-var-text");
        ewRlVal1Box.textContent = "";
        ewRlVal1Chars.forEach(function (ch) {
          const ewRlVal1Span = document.createElement("span");
          ewRlVal1Span.className = "ew-rl-val1-ch";
          ewRlVal1Span.textContent = ch;
          ewRlVal1Box.appendChild(ewRlVal1Span);
        });
        const ewRlVal2Chars = Array.from(String(vars["item2Value"] || "").trim());
        const ewRlVal2Box = document.getElementById("ew-rl-val2");
        ewRlVal2Box.removeAttribute("data-var-text");
        ewRlVal2Box.textContent = "";
        ewRlVal2Chars.forEach(function (ch) {
          const ewRlVal2Span = document.createElement("span");
          ewRlVal2Span.className = "ew-rl-val2-ch";
          ewRlVal2Span.textContent = ch;
          ewRlVal2Box.appendChild(ewRlVal2Span);
        });
        const ewRlVal3Chars = Array.from(String(vars["item3Value"] || "").trim());
        const ewRlVal3Box = document.getElementById("ew-rl-val3");
        ewRlVal3Box.removeAttribute("data-var-text");
        ewRlVal3Box.textContent = "";
        ewRlVal3Chars.forEach(function (ch) {
          const ewRlVal3Span = document.createElement("span");
          ewRlVal3Span.className = "ew-rl-val3-ch";
          ewRlVal3Span.textContent = ch;
          ewRlVal3Box.appendChild(ewRlVal3Span);
        });
        tl.fromTo("#ew-rl-rule", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)", duration: 0.6, ease: "power3.out" }, 0);
        tl.fromTo("#ew-rl-kicker", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.25);
        tl.fromTo(".ew-rl-title-ch", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, stagger: 0.045, ease: "power3.out" }, 0.45);
        tl.fromTo("#ew-rl-ordinal", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0 0)", duration: 1.4, ease: "power3.out" }, 0.6);
        tl.fromTo("#ew-rl-spine", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0 0 0 0)", duration: 1.4, ease: "power3.out" }, 0.8);
        tl.fromTo("#ew-rl-lab1", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.11);
        tl.fromTo(".ew-rl-val1-ch", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, stagger: 0.03, ease: "power3.out" }, 1.19);
        tl.fromTo("#ew-rl-lab2", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.27);
        tl.fromTo(".ew-rl-val2-ch", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, stagger: 0.03, ease: "power3.out" }, 1.35);
        tl.fromTo("#ew-rl-lab3", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.43);
        tl.fromTo(".ew-rl-val3-ch", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, stagger: 0.03, ease: "power3.out" }, 1.51);
        tl.to("#ew-rail-col", { yPercent: -3, duration: driftDur, ease: "none" }, driftStart);
        window.__timelines["ew-rail"] = tl;
      </script>
    </template>
  </body>
</html>
