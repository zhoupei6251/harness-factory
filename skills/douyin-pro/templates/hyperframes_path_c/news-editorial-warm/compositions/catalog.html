<!doctype html>
<html lang="zh-CN" data-composition-variables='[
    {"id": "kicker", "type": "string", "label": "眉标", "default": "NEWS"},
    {"id": "title", "type": "string", "label": "小标题", "default": "一个标题"},
    {"id": "step1Index", "type": "string", "label": "第1步标号", "default": "01"},
    {"id": "step1Label", "type": "string", "label": "第1步标题", "default": "第一步"},
    {"id": "step1Body", "type": "string", "label": "第1步说明", "default": "说明一"},
    {"id": "step2Index", "type": "string", "label": "第2步标号", "default": "02"},
    {"id": "step2Label", "type": "string", "label": "第2步标题", "default": "第二步"},
    {"id": "step2Body", "type": "string", "label": "第2步说明", "default": "说明二"},
    {"id": "step3Index", "type": "string", "label": "第3步标号", "default": "03"},
    {"id": "step3Label", "type": "string", "label": "第3步标题", "default": "第三步"},
    {"id": "step3Body", "type": "string", "label": "第3步说明", "default": "说明三"},
    {"id": "slotSeconds", "type": "number", "label": "本镜可见秒数", "default": 4, "min": 1}
  ]'>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
@font-face {
  font-family: "HF CJK";
  src: local("Noto Sans SC"), local("Microsoft YaHei"), local("DengXian");
  font-weight: 100 900;
}

@font-face {
  font-family: "HF Serif CJK";
  src: local("Noto Serif SC"), local("SimSun");
  font-weight: 100 900;
}

#root { position: absolute; inset: 0; overflow: hidden;
  background: #f5efe3;
  color: #1f1b16;
  font-family: "HF CJK", sans-serif;
}

#ew-catalog-col { position: absolute; top: 8.5cqh; left: 0;
  width: 100cqw; height: 64.8cqh; }

#ew-ct-rule { position: absolute; top: 0cqh; left: 6cqw; width: 88cqw; height: 0.35cqh; background: #ddd3bf; }


#ew-ct-kicker { position: absolute; top: 4.5cqh; left: 6cqw; max-width: 22.4cqw; background: #B45309; color: #ffffff; font-size: 2.8cqw; font-weight: 900; padding: 0.85cqh 1.9cqw; transform-origin: 0% 50%; }


#ew-ct-title { position: absolute; top: 10cqh; left: 6cqw; max-width: 88cqw; font-family: HF Serif CJK, serif; font-size: 7cqw; font-weight: 900; line-height: 1.2; letter-spacing: -0.01em; color: #1f1b16; }
.ew-ct-title-ch { display: inline-block; }


#ew-ct-idx1 { position: absolute; top: 27.1cqh; left: 6cqw; max-width: 6.37cqw; font-family: Playfair Display, sans-serif; font-size: 5.6cqw; line-height: 1.12; color: #B45309; }


#ew-ct-lab1 { position: absolute; top: 27.5cqh; left: 15cqw; max-width: 73cqw; font-family: HF Serif CJK, serif; font-size: 4.6cqw; font-weight: 900; line-height: 1.2; letter-spacing: -0.01em; color: #1f1b16; }
.ew-ct-lab1-ch { display: inline-block; }


#ew-ct-body1 { position: absolute; top: 33.4cqh; left: 15cqw; max-width: 73cqw; font-family: HF CJK, sans-serif; font-size: 3.2cqw; font-weight: 400; line-height: 1.5; color: #1f1b16; }


#ew-ct-sep2 { position: absolute; top: 38.5cqh; left: 6cqw; width: 88cqw; height: 0.28cqh; background: #ddd3bf; }


#ew-ct-idx2 { position: absolute; top: 40.1cqh; left: 6cqw; max-width: 6.37cqw; font-family: Playfair Display, sans-serif; font-size: 5.6cqw; line-height: 1.12; color: #B45309; }


#ew-ct-lab2 { position: absolute; top: 40.5cqh; left: 15cqw; max-width: 73cqw; font-family: HF Serif CJK, serif; font-size: 4.6cqw; font-weight: 900; line-height: 1.2; letter-spacing: -0.01em; color: #1f1b16; }
.ew-ct-lab2-ch { display: inline-block; }


#ew-ct-body2 { position: absolute; top: 46.4cqh; left: 15cqw; max-width: 73cqw; font-family: HF CJK, sans-serif; font-size: 3.2cqw; font-weight: 400; line-height: 1.5; color: #1f1b16; }


#ew-ct-sep3 { position: absolute; top: 51.5cqh; left: 6cqw; width: 88cqw; height: 0.28cqh; background: #ddd3bf; }


#ew-ct-idx3 { position: absolute; top: 53.1cqh; left: 6cqw; max-width: 6.37cqw; font-family: Playfair Display, sans-serif; font-size: 5.6cqw; line-height: 1.12; color: #B45309; }


#ew-ct-lab3 { position: absolute; top: 53.5cqh; left: 15cqw; max-width: 73cqw; font-family: HF Serif CJK, serif; font-size: 4.6cqw; font-weight: 900; line-height: 1.2; letter-spacing: -0.01em; color: #1f1b16; }
.ew-ct-lab3-ch { display: inline-block; }


#ew-ct-body3 { position: absolute; top: 59.4cqh; left: 15cqw; max-width: 73cqw; font-family: HF CJK, sans-serif; font-size: 3.2cqw; font-weight: 400; line-height: 1.5; color: #1f1b16; }


      </style>
      <div id="root" data-composition-id="ew-catalog" data-width="1080" data-height="1920">
        <div id="ew-catalog-col">
          <div id="ew-ct-rule"></div>
          <div id="ew-ct-kicker" data-var-text="kicker"></div>
          <div id="ew-ct-title" data-var-text="title"><span class="ew-ct-title-ch"></span></div>
          <div id="ew-ct-idx1"><span class="ew-ct-idx1-value" data-var-text="step1Index"></span></div>
          <div id="ew-ct-lab1" data-var-text="step1Label"><span class="ew-ct-lab1-ch"></span></div>
          <div id="ew-ct-body1" data-var-text="step1Body"></div>
          <div id="ew-ct-sep2"></div>
          <div id="ew-ct-idx2"><span class="ew-ct-idx2-value" data-var-text="step2Index"></span></div>
          <div id="ew-ct-lab2" data-var-text="step2Label"><span class="ew-ct-lab2-ch"></span></div>
          <div id="ew-ct-body2" data-var-text="step2Body"></div>
          <div id="ew-ct-sep3"></div>
          <div id="ew-ct-idx3"><span class="ew-ct-idx3-value" data-var-text="step3Index"></span></div>
          <div id="ew-ct-lab3" data-var-text="step3Label"><span class="ew-ct-lab3-ch"></span></div>
          <div id="ew-ct-body3" data-var-text="step3Body"></div>
        </div>
      </div>
      <script>
        const vars = window.__hyperframes.getVariables();
        const slot = Number(vars.slotSeconds) || 4;
        const INTRO_END = 1.5;
        const MIN_DRIFT = 0.6;
        const driftStart = Math.max(0, Math.min(INTRO_END, slot - MIN_DRIFT));
        const driftDur = Math.max(MIN_DRIFT, slot - driftStart);
        
        const tl = gsap.timeline({ paused: true });
        const ewCtTitleChars = Array.from(String(vars["title"] || "").trim());
        const ewCtTitleBox = document.getElementById("ew-ct-title");
        ewCtTitleBox.removeAttribute("data-var-text");
        ewCtTitleBox.textContent = "";
        ewCtTitleChars.forEach(function (ch) {
          const ewCtTitleSpan = document.createElement("span");
          ewCtTitleSpan.className = "ew-ct-title-ch";
          ewCtTitleSpan.textContent = ch;
          ewCtTitleBox.appendChild(ewCtTitleSpan);
        });
        const ewCtLab1Chars = Array.from(String(vars["step1Label"] || "").trim());
        const ewCtLab1Box = document.getElementById("ew-ct-lab1");
        ewCtLab1Box.removeAttribute("data-var-text");
        ewCtLab1Box.textContent = "";
        ewCtLab1Chars.forEach(function (ch) {
          const ewCtLab1Span = document.createElement("span");
          ewCtLab1Span.className = "ew-ct-lab1-ch";
          ewCtLab1Span.textContent = ch;
          ewCtLab1Box.appendChild(ewCtLab1Span);
        });
        const ewCtLab2Chars = Array.from(String(vars["step2Label"] || "").trim());
        const ewCtLab2Box = document.getElementById("ew-ct-lab2");
        ewCtLab2Box.removeAttribute("data-var-text");
        ewCtLab2Box.textContent = "";
        ewCtLab2Chars.forEach(function (ch) {
          const ewCtLab2Span = document.createElement("span");
          ewCtLab2Span.className = "ew-ct-lab2-ch";
          ewCtLab2Span.textContent = ch;
          ewCtLab2Box.appendChild(ewCtLab2Span);
        });
        const ewCtLab3Chars = Array.from(String(vars["step3Label"] || "").trim());
        const ewCtLab3Box = document.getElementById("ew-ct-lab3");
        ewCtLab3Box.removeAttribute("data-var-text");
        ewCtLab3Box.textContent = "";
        ewCtLab3Chars.forEach(function (ch) {
          const ewCtLab3Span = document.createElement("span");
          ewCtLab3Span.className = "ew-ct-lab3-ch";
          ewCtLab3Span.textContent = ch;
          ewCtLab3Box.appendChild(ewCtLab3Span);
        });
        tl.fromTo("#ew-ct-rule", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)", duration: 0.6, ease: "power3.out" }, 0);
        tl.fromTo("#ew-ct-kicker", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.25);
        tl.fromTo(".ew-ct-title-ch", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, stagger: 0.045, ease: "power3.out" }, 0.45);
        tl.fromTo("#ew-ct-idx1", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0 0)", duration: 1.4, ease: "power3.out" }, 0.95);
        tl.fromTo(".ew-ct-lab1-ch", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, stagger: 0.03, ease: "power3.out" }, 1);
        tl.fromTo("#ew-ct-body1", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.18);
        tl.fromTo("#ew-ct-sep2", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)", duration: 0.6, ease: "power3.out" }, 1.1);
        tl.fromTo("#ew-ct-idx2", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0 0)", duration: 1.4, ease: "power3.out" }, 1.15);
        tl.fromTo(".ew-ct-lab2-ch", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, stagger: 0.03, ease: "power3.out" }, 1.2);
        tl.fromTo("#ew-ct-body2", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.38);
        tl.fromTo("#ew-ct-sep3", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)", duration: 0.6, ease: "power3.out" }, 1.3);
        tl.fromTo("#ew-ct-idx3", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0 0)", duration: 1.4, ease: "power3.out" }, 1.35);
        tl.fromTo(".ew-ct-lab3-ch", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, stagger: 0.03, ease: "power3.out" }, 1.4);
        tl.fromTo("#ew-ct-body3", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.58);
        tl.to("#ew-catalog-col", { yPercent: -3, duration: driftDur, ease: "none" }, driftStart);
        window.__timelines["ew-catalog"] = tl;
      </script>
    </template>
  </body>
</html>
