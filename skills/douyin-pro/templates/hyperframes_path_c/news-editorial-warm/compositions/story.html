<!doctype html>
<html lang="zh-CN" data-composition-variables='[
    {"id": "kicker", "type": "string", "label": "眉标", "default": "NEWS"},
    {"id": "ordinal", "type": "string", "label": "镜序", "default": "01"},
    {"id": "tone", "type": "string", "label": "地面明暗", "default": "light"},
    {"id": "title", "type": "string", "label": "小标题", "default": "一个标题"},
    {"id": "onscreen", "type": "string", "label": "屏句(唯一上屏整句, 不进配音)", "default": "没人告诉他这件事"},
    {"id": "imagePath", "type": "string", "label": "配图路径(纹理, 无则塌槽)", "default": ""},
    {"id": "slotSeconds", "type": "number", "label": "本镜可见秒数", "default": 4, "min": 1}
  ]'>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
@font-face {
  font-family: "HF CJK";
  src: local("Noto Sans SC"), local("Microsoft YaHei"), local("DengXian");
  font-weight: 100 900;
}

@font-face {
  font-family: "HF Serif CJK";
  src: local("Noto Serif SC"), local("SimSun");
  font-weight: 100 900;
}

#root { position: absolute; inset: 0; overflow: hidden;
  background: #f5efe3;
  color: #1f1b16;
  font-family: "HF CJK", sans-serif;
}

#ew-story-col { position: absolute; top: 8.5cqh; left: 0;
  width: 100cqw; height: 63.42cqh; }

#ew-sy-rule { position: absolute; top: 0cqh; left: 6cqw; width: 88cqw; height: 0.35cqh; background: #ddd3bf; }


#ew-sy-kicker { position: absolute; top: 4.5cqh; left: 6cqw; max-width: 22.4cqw; background: #B45309; color: #ffffff; font-size: 2.8cqw; font-weight: 900; padding: 0.85cqh 1.9cqw; transform-origin: 0% 50%; }


#ew-sy-photo { position: absolute; top: 34.5cqh; left: 6cqw; width: 40cqw; height: 13cqh; overflow: hidden; display: none; }
#ew-sy-photo img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 40%; }


#ew-sy-title { position: absolute; top: 15.5cqh; left: 6cqw; max-width: 88cqw; font-family: HF Serif CJK, serif; font-size: 8.4cqw; font-weight: 900; line-height: 1.24; letter-spacing: -0.01em; color: #1f1b16; }
.ew-sy-title-ch { display: inline-block; }


#ew-sy-ordinal { position: absolute; top: 4.5cqh; left: 75.79cqw; max-width: 18.21cqw; font-family: Playfair Display, sans-serif; font-size: 16cqw; line-height: 1.12; color: #6b5f4f; }


#ew-sy-bar { position: absolute; top: 49.5cqh; left: 6cqw; width: 14cqw; height: 1cqh; background: #B45309; transform-origin: 0% 50%; }


#ew-sy-onscreen { position: absolute; top: 55.5cqh; left: 6cqw; max-width: 80cqw; font-family: HF Serif CJK, sans-serif; font-size: 4.4cqw; font-weight: 400; line-height: 1.6; color: #1f1b16; }


#root[data-tone="dark"] { background: #1f1b16; }
#root[data-tone="dark"] #ew-sy-onscreen { color: #f5efe3; }
#root[data-tone="dark"] #ew-sy-ordinal { color: #ddd3bf; }
#root[data-tone="dark"] #ew-sy-title { color: #f5efe3; }
      </style>
      <div id="root" data-composition-id="ew-story" data-hf-primitives="hairline,block-chip,photo-local-crop,char-rise,giant-numeral,rule-pull,cue-fade" data-tone="light" data-width="1080" data-height="1920">
        <div id="ew-story-col">
          <div id="ew-sy-rule"></div>
          <div id="ew-sy-kicker" data-var-text="kicker"></div>
          <figure id="ew-sy-photo"><img alt="" /></figure>
          <div id="ew-sy-title" data-var-text="title"><span class="ew-sy-title-ch"></span></div>
          <div id="ew-sy-ordinal"><span class="ew-sy-ordinal-value" data-var-text="ordinal"></span></div>
          <div id="ew-sy-bar"></div>
          <div id="ew-sy-onscreen" data-var-text="onscreen"></div>
        </div>
      </div>
      <script>
        const vars = window.__hyperframes.getVariables();
        const slot = Number(vars.slotSeconds) || 4;
        const INTRO_END = 1.5;
        const MIN_DRIFT = 0.6;
        const driftStart = Math.max(0, Math.min(INTRO_END, slot - MIN_DRIFT));
        const driftDur = Math.max(MIN_DRIFT, slot - driftStart);
        const rootEl = document.getElementById("root");
        const tone = String(vars.tone || "light").toLowerCase();
        rootEl.dataset.tone = tone === "dark" ? "dark" : "light";
        const tl = gsap.timeline({ paused: true });
        const ewSyPhotoSrc = String(vars["imagePath"] || "").trim();
        if (ewSyPhotoSrc) {
          document.getElementById("ew-sy-photo").style.display = "block";
          document.querySelector("#ew-sy-photo img").src = ewSyPhotoSrc;
        }
        const ewSyTitleChars = Array.from(String(vars["title"] || "").trim());
        const ewSyTitleBox = document.getElementById("ew-sy-title");
        ewSyTitleBox.removeAttribute("data-var-text");
        ewSyTitleBox.textContent = "";
        ewSyTitleChars.forEach(function (ch) {
          const ewSyTitleSpan = document.createElement("span");
          ewSyTitleSpan.className = "ew-sy-title-ch";
          ewSyTitleSpan.textContent = ch;
          ewSyTitleBox.appendChild(ewSyTitleSpan);
        });
        tl.fromTo("#ew-sy-rule", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)", duration: 0.6, ease: "power3.out" }, 0);
        tl.fromTo("#ew-sy-kicker", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.25);
        tl.fromTo("#ew-sy-photo", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0 0 0)", duration: 0.7, ease: "power3.out" }, 0.3);
        tl.fromTo(".ew-sy-title-ch", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, stagger: 0.045, ease: "power3.out" }, 0.45);
        tl.fromTo("#ew-sy-ordinal", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0 0)", duration: 1.4, ease: "power3.out" }, 0.6);
        tl.fromTo("#ew-sy-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 1.1);
        tl.fromTo("#ew-sy-onscreen", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.3);
        tl.to("#ew-story-col", { yPercent: -3, duration: driftDur, ease: "none" }, driftStart);
        window.__timelines["ew-story"] = tl;
      </script>
    </template>
  </body>
</html>
