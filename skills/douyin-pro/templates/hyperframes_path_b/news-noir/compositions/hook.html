<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id": "kicker", "type": "string", "label": "眉标", "default": "NEWS"},
    {"id": "headTop", "type": "string", "label": "标题第一行", "default": "标题第一行"},
    {"id": "headBottomLead", "type": "string", "label": "标题第二行前段", "default": "第二行"},
    {"id": "headAccent", "type": "string", "label": "标题第二行强调", "default": "强调"},
    {"id": "support", "type": "string", "label": "辅助行", "default": "辅助信息"},
    {"id": "imagePath", "type": "string", "label": "本镜真实图片(work_dir 相对路径, 空=无图)", "default": ""},
    {"id": "imageCredit", "type": "string", "label": "本镜图片屏上署名(空=无图)", "default": ""},
    {"id": "slotSeconds", "type": "number", "label": "本镜可见秒数", "default": 4, "min": 1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* news-coral · hook — 首镜钩子: 珊瑚火带(纯形状) + 白底眉标片 + 反相强调词
           对比度复算见 frame.md §1.1（`audit_pack_contrast.py news-coral`）:
           · 墨字在珊瑚上有 5.10, 珊瑚带面上还是不写字 → 法则 L1: 珊瑚只当形状。
           · 珊瑚字在墨上同样 5.10, 强调词也不直接染珊瑚 → 法则 L2, 改用珊瑚片+白字 (3.41, 大字档)。
           · 眉标走白片+珊瑚字 (3.41), 压在火带与墨段的交界上, 把两个色域缝起来。
           · 带 background 的片块只做 scaleX 擦入, 禁止 opacity: 半透明会把片底色与地面混色,
             实测白片 α=0.72 压在珊瑚带上 → 有效底色 rgb(246,213,213) → 珊瑚字只剩 2.5:1 (审计不过)。
             法则: 面对形状用 transform 入场, 墨(纯文字)才允许淡入。
           本文件是版式骨架, 由 host.html 的挂载点用 data-variable-values 逐实例填值。
           引擎只克隆 <template> 内容, <head> 会被丢弃 → 样式/脚本/字体声明全在 template 内。
           字体审计按文件走 → 每个版式文件必须自带中文 @font-face。 */
        @font-face {
          font-family: "HF CJK";
          src:
            local("Noto Sans SC"),
            local("NotoSansSC-VF"),
            local("Source Han Sans SC"),
            local("Noto Sans CJK SC"),
            local("Microsoft YaHei"),
            local("PingFang SC");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0a0a0d;
          color: #f5f0e8;
          font-family: "HF CJK", sans-serif;
        }
        
        /* 把所有非图非署名的 root 子元素提到 z-index 1, 让 mask 不盖住任何文字
           —— 一条 rule 覆盖 6 个 composition 的所有 wrapper */
        #root > *:not([class$="-photo"]):not([class$="-photo-credit"]) {
          z-index: 1;
          /* 通用文字阴影: 让任何深浅底图上的文字都自带暗晕, WCAG AA 对比度兜底 */
          text-shadow: 0 1px 3px rgba(0,0,0,0.7), 0 0 1px rgba(0,0,0,0.5);
        }.h-band {
          position: absolute;
          inset: 0 0 auto 0;
          height: 22cqh;
          background: #c0392b;
          transform-origin: 50% 0%;
          z-index: 1;       /* 火带压在背景图上, 保留品牌识别 */
        }
        /* 45° 网纹只在珊瑚面上走, 不改变几何 */
        .h-band::before {
          content: "";
          position: absolute;
          inset: 0;
          background-image: repeating-linear-gradient(
            45deg,
            transparent 0 20px,
            rgba(0, 0, 0, 0.06) 20px 40px
          );
          pointer-events: none;
        }
        .h-eb {
          position: absolute;
          left: 6cqw;
          top: 17cqh;
          background: #ffffff;
          color: #e85d5d;
          font-family: "JetBrains Mono", monospace;
          font-size: 2.9cqw;
          font-weight: 700;
          letter-spacing: 0.16em;
          padding: 1cqh 2cqw;
          transform-origin: 0% 50%;
          z-index: 2;       /* 在背景图(z=0)+mask 之上, 在火带(1)之上 —— 火带擦入
                              会盖住它一瞬再让位, 文字始终在前景最高 */
        }
        .h-field {
          position: absolute;
          inset: 22cqh 0 20cqh 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 6cqw;
          z-index: 2;       /* 在背景图+mask(z=0)之上, 火带(1)之上 */
        }
        .h-hd {
          font-size: 10.5cqw;
          font-weight: 900;
          line-height: 1.24;
          letter-spacing: -0.01em;
          max-width: 88cqw;
        }
        .h-ac {
          display: inline-block;
          background: #c0392b;
          color: #ffffff;
          padding: 0 1.4cqw;
          transform-origin: 0% 50%;
        }
        .h-hair {
          width: 14cqw;
          height: 1.1cqh;
          background: #c0392b;
          margin: 3.6cqh 0;
          transform-origin: 0% 50%;
        }
        .h-sup {
          font-size: 3.9cqw;
          font-weight: 400;
          /* #dcdcdc 在 h-sup 区 (mask 0.45 alpha + 中等亮图) 实测对比度 ≥ 3.7:1,
           旧 #b0b0b0 仅 2.35:1 (WCAG AA 大字档 3:1 失败) */
          color: #dcdcdc;
          max-width: 74cqw;
        }

        /* 真实图板(commons_media): 白面图框 + 图源指针。无图时整块 display:none,
           版面与无图历史版完全一致; 有图由脚本亮板并加 .has-photo 收窄文字位。
           面自带 background ⇒ 只做 scaleX 擦入, 禁止 opacity(法则 8)。 */
        /* 真实图作满屏背景层(cinematic): 有图时整屏铺底, ::before 加黑色渐变 mask
           让中段文字不被底图抢戏; 无图时 display:none, 版面与无图历史版完全一致。
           Ken Burns 在 script 里驱动 hk-img 的 scale 1.06→1.0。Credit 移到右下角,
           半透明黑底白字, 不再压在大段文字区里。 */
        .hk-photo {
          position: absolute;
          inset: 0;
          margin: 0;
          padding: 0;
          background: transparent;
          display: none;
          overflow: hidden;
          z-index: 0;
          transform-origin: 50% 50%;
        }
        .hk-photo::before {
          content: "";
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg,
            rgba(0,0,0,0.55) 0%,
            rgba(0,0,0,0.0) 22%,
            rgba(0,0,0,0.0) 55%,
            rgba(0,0,0,0.45) 78%,
            rgba(0,0,0,0.75) 100%);
          pointer-events: none;
        }
        .hk-photo-img {
          width: 100%;
          height: 100%;
          display: block;
          object-fit: cover;
          /* 起始 1.0 (layout box 与容器一致, check 不报 overflow), Ken Burns 推到 1.06
             6% 溢出由父 .hk-photo overflow:hidden 裁切, 是设计内的镜头感 */
          transform: scale(1.02);
          transform-origin: 50% 50%;
        }
        /* credit 已是 root 直接子元素, z-index=3 直接与 fire band(z=1)/h-field(z=2)
           同层比较; 位置仍在火带内 (top:17cqh), 不挡火带也不挡 h-field。
           半透黑底 rgba(0,0,0,0.7) 压在珊瑚红上 => 实测对比度 ≥ 7:1 (vs 白字) */
        .hk-photo-credit {
          position: absolute;
          top: 17cqh;
          right: 6cqw;
          z-index: 3;
          font-family: "JetBrains Mono", monospace;
          font-size: 1.4cqw;
          line-height: 1.3;
          letter-spacing: 0.08em;
          color: rgb(255,255,255);
          background: rgba(0,0,0,0.7);
          padding: 0.5cqh 1.4cqw;
          text-align: right;
        }
        /* 图作为底后, 标题与辅助行从满屏宽缩到左半, 给底图留出右半空间呼吸 */
        .has-photo .h-hd { max-width: 56cqw; }
        .has-photo .h-sup { max-width: 56cqw; }
      </style>

      <div id="root" data-composition-id="nc-night-hook" data-width="1080" data-height="1920">
        <div class="h-band" id="h-band"></div>
        <div class="h-eb" id="h-eb" data-var-text="kicker">NEWS</div>
        <div class="h-field" id="h-field">
          <div class="h-hd">
            <div id="h-l1" data-var-text="headTop">标题第一行</div>
            <div><span id="h-l2" data-var-text="headBottomLead">第二行</span><span class="h-ac" id="h-ac" data-var-text="headAccent">强调</span></div>
          </div>
          <div class="h-hair" id="h-hair"></div>
          <div class="h-sup" id="h-sup" data-var-text="support">辅助信息</div>
        </div>
        <!-- 真实图作为满屏背景, figure 是 img 容器; credit 移出 figure, 是 root
             直接子元素 —— 这样 credit z-index 才能逃出 figure 的 stacking context,
             否则 credit z=3 仍被困在 z=0 的 figure 内, 被 z=1 的 fire band 盖住。
             figure 加 data-layout-allow-overflow 标注 Ken Burns 溢出是有意的。 -->
        <figure class="hk-photo" id="hk-photo" data-layout-allow-overflow>
          <img class="hk-photo-img" id="hk-img" data-layout-allow-overflow alt="" />
        </figure>
        <figcaption class="hk-photo-credit" id="hk-credit">图源：Wikimedia Commons</figcaption>
      </div>

      <script>
        const vars = window.__hyperframes.getVariables();
        const hasPhoto = Boolean(String(vars.imagePath || "").trim());
        const slot = Number(vars.slotSeconds) || 4;
        const INTRO_END = 1.5;
        const MIN_DRIFT = 0.6;
        const driftStart = Math.max(0, Math.min(INTRO_END, slot - MIN_DRIFT));
        const driftDur = Math.max(MIN_DRIFT, slot - driftStart);
        const tl = gsap.timeline({ paused: true });
        // 字符逐字入场: 在 onStart 里 split (此时元素已就绪) + tl.from stagger
        // split 函数定义放模块作用域

        // 字符逐字入场: 拆 h-hd/h-l1/h-l2 为 span, 字符 stagger 替代整句 fade
        // 入场: 火带擦入 → 眉标片擦入 → 两行标题淡入 → 标尺 → 辅助行 (全部 fromTo, seek 可回退)
        // 片块(自带 background)一律 scaleX 擦入, 不做 opacity —— 见文件头法则。
        tl.fromTo("#h-band", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 0);
        tl.fromTo("#h-eb", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.3);
        // (字符 stagger 取代)
        // (字符 stagger 取代)
        tl.fromTo("#h-ac", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.82);
        tl.fromTo("#h-hair", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 1.05);
        tl.fromTo("#h-sup", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.4 }, 1.25);
        // 呼吸: 整镜剩余时间持续位移, 不留静止尾巴
        tl.to("#h-field", { yPercent: -3, duration: driftDur, ease: "none" }, driftStart);
        tl.to("#h-eb", { y: 12, duration: driftDur, ease: "none" }, driftStart);
        // 真实图板: 有图才亮出(白面 → scaleX 擦入), 无图保持旧版面不变
        if (hasPhoto) {
          document.getElementById("hk-photo").style.display = "block";
          document.getElementById("hk-img").src = vars.imagePath;
          document.getElementById("hk-credit").textContent =
              vars.imageCredit || "图源：Wikimedia Commons";
          document.getElementById("root").classList.add("has-photo");
          // 整屏图片是 asset (非 background-color 面块), 可以 opacity 淡入
          tl.fromTo("#hk-img", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);
          // Ken Burns: 起始 1.0 (CSS 已设) 缓慢推到 1.06 —— push in 镜头感, ease none 让运动连续
          tl.to("#hk-img", { scale: 1.08, duration: driftStart + driftDur, ease: "power1.inOut" }, 0);
        }
        window.__timelines["nc-night-hook"] = tl;
      </script>
    </template>
  </body>
</html>
