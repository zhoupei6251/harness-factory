<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id": "kicker", "type": "string", "label": "眉标", "default": "QUOTE"},
    {"id": "quoteBody", "type": "string", "label": "引文", "default": "引文内容"},
    {"id": "attribution", "type": "string", "label": "归属", "default": "出处"},
    {"id": "slotSeconds", "type": "number", "label": "本镜可见秒数", "default": 4, "min": 1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* news-coral · quote — 原话: 白卡 + 珊瑚顶边 + 巨引号 + 归属行
           引号是装饰 (data-layout-ignore), 珊瑚只出现在这里; 卡内正文一律墨色。 */
        @font-face {
          font-family: "HF CJK";
          src:
            local("Noto Sans SC"),
            local("NotoSansSC-VF"),
            local("Source Han Sans SC"),
            local("Noto Sans CJK SC"),
            local("Microsoft YaHei"),
            local("PingFang SC");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #e8e0d4;
          color: #1a1a1a;
          font-family: "HF CJK", sans-serif;
        }
        .qt-card {
          position: absolute;
          inset: 22cqh 6cqw auto 6cqw;
          background: #ffffff;
          border-top: 0.9cqw solid #e85d5d;
          padding: 5cqh 5cqw 6cqh;
        }
        .qt-mark {
          font-family: "League Gothic", sans-serif;
          font-size: 22cqw;
          line-height: 0.6;
          color: #e85d5d;
          height: 12cqh;
          pointer-events: none;
        }
        .qt-eb {
          font-family: "JetBrains Mono", monospace;
          font-size: 2.6cqw;
          font-weight: 700;
          letter-spacing: 0.16em;
          color: #6b6b6b;
          margin-bottom: 2.2cqh;
        }
        .qt-body {
          font-size: 6.4cqw;
          font-weight: 900;
          line-height: 1.5;
          letter-spacing: -0.005em;
        }
        .qt-at {
          margin-top: 3.6cqh;
          display: flex;
          align-items: center;
          gap: 2cqw;
          font-size: 3.6cqw;
          color: #6b6b6b;
        }
        .qt-dash {
          width: 6cqw;
          height: 0.7cqh;
          background: #e85d5d;
          transform-origin: 0% 50%;
        }
      </style>

      <div id="root" data-composition-id="nc-quote" data-width="1080" data-height="1920">
        <div class="qt-card" id="qt-card">
          <div class="qt-mark" id="qt-mark" data-layout-ignore="true">&ldquo;</div>
          <div class="qt-eb" id="qt-eb" data-var-text="kicker">QUOTE</div>
          <div class="qt-body" id="qt-body" data-var-text="quoteBody">引文内容</div>
          <div class="qt-at" id="qt-at">
            <div class="qt-dash" id="qt-dash"></div>
            <div id="qt-attribution" data-var-text="attribution">出处</div>
          </div>
        </div>
      </div>

      <script>
        const vars = window.__hyperframes.getVariables();
        const slot = Number(vars.slotSeconds) || 4;
        const INTRO_END = 1.5;
        const MIN_DRIFT = 0.6;
        const driftStart = Math.max(0, Math.min(INTRO_END, slot - MIN_DRIFT));
        const driftDur = Math.max(MIN_DRIFT, slot - driftStart);
        const tl = gsap.timeline({ paused: true });
        // 卡片自带 white 背景 → 只做位移不做淡入 (法则 8: 面用 transform, 墨才用 opacity);
        // 卡内文字随后逐条打印, 于是入场是"纸先到、字后印"。
        tl.fromTo("#qt-card", { y: 60 }, { y: 0, duration: 0.55, ease: "power3.out" }, 0);
        tl.fromTo("#qt-mark", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 0.2);
        tl.fromTo("#qt-eb", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35 }, 0.35);
        tl.fromTo("#qt-body", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.5);
        tl.fromTo("#qt-at", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45 }, 0.95);
        tl.fromTo("#qt-dash", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 1.05);
        tl.to("#qt-card", { yPercent: -2.2, duration: driftDur, ease: "none" }, driftStart);
        window.__timelines["nc-quote"] = tl;
      </script>
    </template>
  </body>
</html>
