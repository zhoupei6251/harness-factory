<!doctype html>
<html
  lang="zh-CN"
  data-composition-variables='[
    {"id": "kicker", "type": "string", "label": "眉标", "default": "ACTION"},
    {"id": "cta", "type": "string", "label": "行动指令前段", "default": "今天就查一下"},
    {"id": "ctaAccent", "type": "string", "label": "行动指令强调", "default": "社保"},
    {"id": "channel", "type": "string", "label": "频道/来源行", "default": "央视新闻"},
    {"id": "imagePath", "type": "string", "label": "本镜真实图片(work_dir 相对路径, 空=无图)", "default": ""},
    {"id": "imageCredit", "type": "string", "label": "本镜图片屏上署名(空=无图)", "default": ""},
    {"id": "slotSeconds", "type": "number", "label": "本镜可见秒数", "default": 4, "min": 1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        /* news-coral · closer — 收口: 顶部珊瑚火带(与 hook 互为书挡) + 一句行动指令 + 来源行
           旧稿这里写着"珊瑚文字在墨底 5.08 AA", 说是没算过的数; 2026-09-29 复算后
           coral/ink = **5.10** (frame.md §1.1) —— 当时订正用的 2.92 反倒才是错的
           (根因是把 L(ink) 记成 0.0554, 真值 0.0103)。数学过了, 法则是另一回事:
           本版式的珊瑚一律只做形状, 文字走
           cream / light-gray / "白片+珊瑚字"(3.41, 大字档) 三种合法写法。
           D4 修正: 旧 .cl-mark 是 15cqw×3.2cqh 的孤立矩形, 浮在空白里像漏画的占位块。
           现在改成整宽火带, 且几何与 hook 逐项相同(带 22cqh、眉标片 17cqh) →
           首镜与末镜互为书的封面与封底, 观感上"这条片子是一个整体"。
           几何: 火带 0→22cqh; 眉标片 top 17cqh、片高≈3.8cqh(2.9cqw 字一行 ≈1.9cqh + 上下
           padding 1.8cqh)→ 下沿 20.8cqh, 正好压在带与墨的交界缝上; 正文区
           `inset: 22cqh 6cqw 20cqh 6cqw` 与 hook 的 `.h-field`(22cqh 0 20cqh 0 + padding 0 6cqw)
           是同一个内容盒 —— 书挡要的就是"逐项相同", 连左右留白都不许差。
           内容高度 = 两行 CTA 14.4(10.5cqw×1.22×2) + 发丝线 0.35 + 来源行 2.0(3cqw×1.2)
           + 两个 gap 6.4 = 23.2cqh; 区高 58cqh 居中 → 上下各余 17.4cqh,
           漂移 `yPercent -3` 只吃掉 1.7cqh → 距字幕禁入区始终有一整块余量。 */
        @font-face {
          font-family: "HF CJK";
          src:
            local("Noto Sans SC"),
            local("NotoSansSC-VF"),
            local("Source Han Sans SC"),
            local("Noto Sans CJK SC"),
            local("Microsoft YaHei"),
            local("PingFang SC");
          font-weight: 100 900;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #1a1a1a;
          color: #f5f0e8;
          font-family: "HF CJK", sans-serif;
        }
        
        /* 把所有非图非署名的 root 子元素提到 z-index 1, 让 mask 不盖住任何文字
           —— 一条 rule 覆盖 6 个 composition 的所有 wrapper */
        #root > *:not([class$="-photo"]):not([class$="-photo-credit"]) {
          z-index: 1;
          /* 通用文字阴影: 让任何深浅底图上的文字都自带暗晕, WCAG AA 对比度兜底 */
          text-shadow: 0 1px 3px rgba(0,0,0,0.7), 0 0 1px rgba(0,0,0,0.5);
        }#root::before {
          content: "";
          position: absolute;
          inset: 0;
          background-image: repeating-linear-gradient(
            45deg,
            transparent 0 20px,
            rgba(245, 240, 232, 0.05) 20px 40px
          );
          pointer-events: none;
        }
        /* 火带是形状: 面上不许写字(珊瑚↔墨/珊瑚↔cream 都不过), 文字全部走独立层 */
        .cl-band {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 22cqh;
          background: #e85d5d;
          transform-origin: 50% 0%;
        }
        .cl-band::before {
          content: "";
          position: absolute;
          inset: 0;
          background-image: repeating-linear-gradient(
            45deg,
            transparent 0 20px,
            rgba(0, 0, 0, 0.06) 20px 40px
          );
          pointer-events: none;
        }
        /* 珊瑚块只是形状; 眉标走白片+珊瑚字, 与 hook 同族 */
        .cl-eb {
          position: absolute;
          left: 6cqw;
          top: 17cqh;
          background: #ffffff;
          font-family: "JetBrains Mono", monospace;
          font-size: 2.9cqw;
          font-weight: 700;
          letter-spacing: 0.16em;
          color: #e85d5d;
          padding: 0.9cqh 1.8cqw;
          transform-origin: 0% 50%;
        }
        .cl-field {
          position: absolute;
          inset: 22cqh 6cqw 20cqh 6cqw;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 3.2cqh;
        }
        .cl-cta {
          font-size: 10.5cqw;
          font-weight: 900;
          line-height: 1.22;
          letter-spacing: -0.01em;
          max-width: 88cqw;
        }
        /* 强调词反相: 珊瑚面 + 白字 (white/coral = 3.41 只在大字档; 墨字/珊瑚字压在珊瑚或墨上
           实测有 5.10, 但法则 L1/L2 让珊瑚只当形状 —— 这里写白字不写墨字) */
        .cl-cta .ac {
          display: inline-block;
          background: #e85d5d;
          color: #ffffff;
          padding: 0 1.4cqw;
          transform-origin: 0% 50%;
        }
        .cl-hair {
          width: 100%;
          height: 0.35cqh;
          background: rgba(245, 240, 232, 0.24);
          transform-origin: 0% 50%;
        }
        .cl-ch {
          font-family: "JetBrains Mono", monospace;
          font-size: 3cqw;
          font-weight: 700;
          letter-spacing: 0.12em;
          color: #b0b0b0;
        }

        /* 真实图板(commons_media): 白面图框 + 图源指针。无图时整块 display:none,
           版面与无图历史版完全一致; 有图由脚本亮板并加 .has-photo 收窄文字位。
           面自带 background ⇒ 只做 scaleX 擦入, 禁止 opacity(法则 8)。 */
        /* 真实图作满屏背景层(cinematic): 有图时整屏铺底, ::before 加黑色渐变 mask
           让中段文字不被底图抢戏; 无图时 display:none, 版面与无图历史版完全一致。
           Ken Burns 在 script 里驱动 cl-img 的 scale 1.0→1.06。Credit 移到右上角,
           半透明黑底白字。 */
        .cl-photo {
          position: absolute;
          inset: 0;
          margin: 0;
          padding: 0;
          background: transparent;
          display: none;
          overflow: hidden;
          z-index: 0;
          transform-origin: 50% 50%;
        }
        .cl-photo::before {
          content: "";
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg,
            rgba(0,0,0,0.55) 0%,
            rgba(0,0,0,0.5) 22%,
            rgba(0,0,0,0.5) 60%,
            rgba(0,0,0,0.7) 82%,
            rgba(0,0,0,0.9) 100%);
          pointer-events: none;
        }
        .cl-photo-img {
          width: 100%;
          height: 100%;
          display: block;
          object-fit: cover;
          transform: scale(1.02);
          transform-origin: 50% 50%;
        }
        .cl-photo-credit {
          position: absolute;
          top: 5cqh;
          right: 3cqw;
          z-index: 3;
          font-family: "JetBrains Mono", monospace;
          font-size: 1.3cqw;
          line-height: 1.3;
          letter-spacing: 0.08em;
          color: rgb(255,255,255);
          background: rgba(0,0,0,0.7);
          padding: 0.4cqh 1.2cqw;
          text-align: right;
        }
        .has-photo .cl-cta { max-width: 52cqw; }
              .has-photo .cl-ch { color: #ebe4d4; padding: 0.4cqh 0.8cqw; background: rgba(0,0,0,0.55); }
      </style>

      <div id="root" data-composition-id="nc-closer" data-width="1080" data-height="1920">

<div class="cl-band" id="cl-band"></div>
        <div class="cl-eb" id="cl-eb" data-var-text="kicker">ACTION</div>
        <div class="cl-field" id="cl-field">
          <div class="cl-cta">
            <span id="cl-cta" data-var-text="cta">今天就查一下</span><span class="ac" id="cl-ac" data-var-text="ctaAccent">社保</span>
          </div>
          <div class="cl-hair" id="cl-hair"></div>
          <div class="cl-ch" id="cl-ch" data-var-text="channel">央视新闻</div>
        </div>
                <!-- 真实图作为满屏背景, figure 是 img 容器; credit 移出 figure, 是 root
             直接子元素 —— 破除 figure 的 stacking context, 让 credit z=3 能与文字同级比较。
             figure 加 data-layout-allow-overflow 标注 Ken Burns 溢出是有意的。 -->
        <figure class="cl-photo" id="cl-photo" data-layout-allow-overflow>
          <img class="cl-photo-img" id="cl-img" data-layout-allow-overflow alt="" />
        </figure>
        <figcaption class="cl-photo-credit" id="cl-credit">图源：Wikimedia Commons</figcaption>
      </div>

      <script>
        const vars = window.__hyperframes.getVariables();
        const hasPhoto = Boolean(String(vars.imagePath || "").trim());
        const slot = Number(vars.slotSeconds) || 4;
        const INTRO_END = 1.5;
        const MIN_DRIFT = 0.6;
        const driftStart = Math.max(0, Math.min(INTRO_END, slot - MIN_DRIFT));
        const driftDur = Math.max(MIN_DRIFT, slot - driftStart);
        const tl = gsap.timeline({ paused: true });
        // 火带用 scaleY 擦入(自带 background 的面禁止 opacity —— 法则 8), 与 hook 的火带同一支笔触
        tl.fromTo("#cl-band", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 0);
        tl.fromTo("#cl-eb", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.3);
        tl.fromTo("#cl-cta", { opacity: 0, y: 64 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.45);
        tl.fromTo("#cl-ac", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 0.6);
        tl.fromTo("#cl-hair", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.9);
        tl.fromTo("#cl-ch", { scaleX: 0 }, { scaleX: 1, duration: 0.45 }, 1.2);
        tl.to("#cl-field", { yPercent: -3, duration: driftDur, ease: "none" }, driftStart);
        // 真实图板: 有图才亮出(白面 → scaleX 擦入), 无图保持旧版面不变
                if (hasPhoto) {
          document.getElementById("cl-photo").style.display = "block";
          document.getElementById("cl-img").src = vars.imagePath;
          document.getElementById("cl-credit").textContent =
              vars.imageCredit || "图源：Wikimedia Commons";
          document.getElementById("root").classList.add("has-photo");
          // 整屏图片是 asset (非 background-color 面块), 可以 opacity 淡入
          tl.fromTo("#cl-img", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);
          // Ken Burns push in: 起始 1.0 (CSS 已设) 缓慢推到 1.06, ease none 让镜头感连续
          tl.to("#cl-img", { scale: 1.08, duration: driftStart + driftDur, ease: "power1.inOut" }, 0);
        }
        window.__timelines["nc-closer"] = tl;
      </script>
    </template>
  </body>
</html>
