# 编译产物：由 pack_layouts.write_layouts 从 compositions/*.html 抽出，勿手改。
schema = "news-layouts/2"

[layouts.catalog]
composition_id = "nc-world2-catalog"
ground_hex = "#0a1018"
ground_tone = "dark"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "CHECKLIST" },
  { id = "title", type = "string", label = "小标题", default = "三步做完" },
  { id = "step1Label", type = "string", label = "第1步标题", default = "第一步" },
  { id = "step1Body", type = "string", label = "第1步说明", default = "说明一" },
  { id = "step2Label", type = "string", label = "第2步标题", default = "第二步" },
  { id = "step2Body", type = "string", label = "第2步说明", default = "说明二" },
  { id = "step3Label", type = "string", label = "第3步标题", default = "第三步" },
  { id = "step3Body", type = "string", label = "第3步说明", default = "说明三" },
  { id = "imagePath", type = "string", label = "本镜真实图片(work_dir 相对路径, 空=无图)", default = "" },
  { id = "imageCredit", type = "string", label = "本镜图片屏上署名(空=无图)", default = "" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.closer]
composition_id = "nc-world2-closer"
ground_hex = "#0a1018"
ground_tone = "dark"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "ACTION" },
  { id = "cta", type = "string", label = "行动指令前段", default = "今天就查一下" },
  { id = "ctaAccent", type = "string", label = "行动指令强调", default = "社保" },
  { id = "channel", type = "string", label = "频道/来源行", default = "央视新闻" },
  { id = "imagePath", type = "string", label = "本镜真实图片(work_dir 相对路径, 空=无图)", default = "" },
  { id = "imageCredit", type = "string", label = "本镜图片屏上署名(空=无图)", default = "" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.hook]
composition_id = "nc-night-hook"
ground_hex = "#0a0a0d"
ground_tone = "dark"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "NEWS" },
  { id = "headTop", type = "string", label = "标题第一行", default = "标题第一行" },
  { id = "headBottomLead", type = "string", label = "标题第二行前段", default = "第二行" },
  { id = "headAccent", type = "string", label = "标题第二行强调", default = "强调" },
  { id = "support", type = "string", label = "辅助行", default = "辅助信息" },
  { id = "imagePath", type = "string", label = "本镜真实图片(work_dir 相对路径, 空=无图)", default = "" },
  { id = "imageCredit", type = "string", label = "本镜图片屏上署名(空=无图)", default = "" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.quote]
composition_id = "nc-night-quote"
ground_hex = "#e8e0d4"
ground_tone = "light"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "QUOTE" },
  { id = "quoteBody", type = "string", label = "引文", default = "引文内容" },
  { id = "attribution", type = "string", label = "归属", default = "出处" },
  { id = "imagePath", type = "string", label = "本镜真实图片(work_dir 相对路径, 空=无图)", default = "" },
  { id = "imageCredit", type = "string", label = "本镜图片屏上署名(空=无图)", default = "" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.rail]
composition_id = "nc-world2-rail"
ground_hex = "#f8fafc"
ground_tone = "light"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "TIMELINE" },
  { id = "title", type = "string", label = "小标题", default = "三段时间线" },
  { id = "ordinal", type = "string", label = "壁纸序号", default = "03" },
  { id = "item1Label", type = "string", label = "第1条标签", default = "标签一" },
  { id = "item1Value", type = "string", label = "第1条事实", default = "事实一" },
  { id = "item2Label", type = "string", label = "第2条标签", default = "标签二" },
  { id = "item2Value", type = "string", label = "第2条事实", default = "事实二" },
  { id = "item3Label", type = "string", label = "第3条标签", default = "标签三" },
  { id = "item3Value", type = "string", label = "第3条事实", default = "事实三" },
  { id = "imagePath", type = "string", label = "本镜真实图片(work_dir 相对路径, 空=无图)", default = "" },
  { id = "imageCredit", type = "string", label = "本镜图片屏上署名(空=无图)", default = "" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.stat]
composition_id = "nc-world2-stat"
ground_hex = "#f8fafc"
ground_tone = "light"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "SECRET" },
  { id = "ordinal", type = "string", label = "壁纸序号", default = "01" },
  { id = "value", type = "string", label = "主数值", default = "0" },
  { id = "unit", type = "string", label = "主单位", default = "元" },
  { id = "label", type = "string", label = "主数值说明", default = "说明" },
  { id = "compareValue", type = "string", label = "对比数值", default = "0" },
  { id = "compareUnit", type = "string", label = "对比单位", default = "元" },
  { id = "compareLabel", type = "string", label = "对比说明", default = "对比" },
  { id = "imagePath", type = "string", label = "本镜真实图片(work_dir 相对路径, 空=无图)", default = "" },
  { id = "imageCredit", type = "string", label = "本镜图片屏上署名(空=无图)", default = "" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.story]
composition_id = "nc-night-story"
ground_hex = "#ece8df"
ground_tone = "light"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "REPORT" },
  { id = "ordinal", type = "string", label = "壁纸序号", default = "02" },
  { id = "tone", type = "string", label = "地面明暗", default = "light" },
  { id = "title", type = "string", label = "领句(作者标题行)", default = "一个误会" },
  { id = "onscreen", type = "string", label = "屏句(唯一上屏整句, 不进配音)", default = "没人告诉他，他一直没问" },
  { id = "imagePath", type = "string", label = "本镜真实图片(work_dir 相对路径, 空=无图)", default = "" },
  { id = "imageCredit", type = "string", label = "本镜图片屏上署名(空=无图)", default = "" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]
