# 编译产物：由 pack_layouts.write_layouts 从 compositions/*.html 抽出，勿手改。
schema = "news-layouts/1"

[layouts.catalog]
composition_id = "np-catalog"
ground_hex = "#e8dfcb"
ground_tone = "light"
variable_ids = ["kicker", "title", "step1Label", "step1Body", "step2Label", "step2Body", "step3Label", "step3Body", "slotSeconds"]

[layouts.closer]
composition_id = "np-closer"
ground_hex = "#1f3a68"
ground_tone = "dark"
variable_ids = ["kicker", "cta", "ctaAccent", "channel", "slotSeconds"]

[layouts.hook]
composition_id = "np-hook"
ground_hex = "#f5efe3"
ground_tone = "light"
variable_ids = ["kicker", "headTop", "headBottomLead", "headAccent", "support", "slotSeconds"]

[layouts.quote]
composition_id = "npc-quote"
ground_hex = "#e8e0d4"
ground_tone = "light"
variable_ids = ["kicker", "quoteBody", "attribution", "imagePath", "imageCredit", "slotSeconds"]

[layouts.rail]
composition_id = "np-rail"
ground_hex = "#f5efe3"
ground_tone = "light"
variable_ids = ["kicker", "title", "ordinal", "item1Label", "item1Value", "item2Label", "item2Value", "item3Label", "item3Value", "slotSeconds"]

[layouts.stat]
composition_id = "npc-stat"
ground_hex = "#f5efe3"
ground_tone = "light"
variable_ids = ["kicker", "ordinal", "value", "unit", "label", "compareValue", "compareUnit", "compareLabel", "imagePath", "imageCredit", "slotSeconds"]

[layouts.story]
composition_id = "np-story"
ground_hex = "#f5efe3"
ground_tone = "light"
variable_ids = ["kicker", "ordinal", "tone", "title", "onscreen", "slotSeconds"]
