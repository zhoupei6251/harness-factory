# 编译产物：由 pack_layouts.write_layouts 从 compositions/*.html 抽出，勿手改。
schema = "news-layouts/2"

[layouts.catalog]
composition_id = "np-catalog"
ground_hex = "#e8dfcb"
ground_tone = "light"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "条文" },
  { id = "title", type = "string", label = "小标题", default = "三条要点" },
  { id = "step1Label", type = "string", label = "第1条标题", default = "第一条" },
  { id = "step1Body", type = "string", label = "第1条说明", default = "说明一" },
  { id = "step2Label", type = "string", label = "第2条标题", default = "第二条" },
  { id = "step2Body", type = "string", label = "第2条说明", default = "说明二" },
  { id = "step3Label", type = "string", label = "第3条标题", default = "第三条" },
  { id = "step3Body", type = "string", label = "第3条说明", default = "说明三" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.closer]
composition_id = "np-closer"
ground_hex = "#1f3a68"
ground_tone = "dark"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "办理" },
  { id = "cta", type = "string", label = "行动指令前段", default = "去查你的" },
  { id = "ctaAccent", type = "string", label = "行动指令强调", default = "缴费记录" },
  { id = "channel", type = "string", label = "频道/来源行", default = "政策来源：人社部官网" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.hook]
composition_id = "np-hook"
ground_hex = "#f5efe3"
ground_tone = "light"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "新规" },
  { id = "headTop", type = "string", label = "公文标题第一行", default = "标题第一行" },
  { id = "headBottomLead", type = "string", label = "公文标题第二行前段", default = "第二行" },
  { id = "headAccent", type = "string", label = "公文标题强调段", default = "施行" },
  { id = "support", type = "string", label = "施行日期/整句屏上位", default = "2026年10月1日施行" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.quote]
composition_id = "npc-quote"
ground_hex = "#e8e0d4"
ground_tone = "light"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "QUOTE" },
  { id = "quoteBody", type = "string", label = "引文", default = "引文内容" },
  { id = "attribution", type = "string", label = "归属", default = "出处" },
  { id = "imagePath", type = "string", label = "本镜真实图片(work_dir 相对路径, 空=无图)", default = "" },
  { id = "imageCredit", type = "string", label = "本镜图片屏上署名(空=无图)", default = "" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.rail]
composition_id = "np-rail"
ground_hex = "#f5efe3"
ground_tone = "light"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "TIMELINE" },
  { id = "title", type = "string", label = "小标题", default = "政策三步走" },
  { id = "ordinal", type = "string", label = "壁纸序号", default = "03" },
  { id = "item1Label", type = "string", label = "第1节点事件", default = "征求意见" },
  { id = "item1Value", type = "string", label = "第1节点日期", default = "2026.03" },
  { id = "item2Label", type = "string", label = "第2节点事件", default = "正式发布" },
  { id = "item2Value", type = "string", label = "第2节点日期", default = "2026.07" },
  { id = "item3Label", type = "string", label = "第3节点事件", default = "全面施行" },
  { id = "item3Value", type = "string", label = "第3节点日期", default = "2026.10" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.stat]
composition_id = "npc-stat"
ground_hex = "#f5efe3"
ground_tone = "light"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "SECRET" },
  { id = "ordinal", type = "string", label = "壁纸序号", default = "01" },
  { id = "value", type = "string", label = "主数值", default = "0" },
  { id = "unit", type = "string", label = "主单位", default = "元" },
  { id = "label", type = "string", label = "主数值说明", default = "说明" },
  { id = "compareValue", type = "string", label = "对比数值", default = "0" },
  { id = "compareUnit", type = "string", label = "对比单位", default = "元" },
  { id = "compareLabel", type = "string", label = "对比说明", default = "对比" },
  { id = "imagePath", type = "string", label = "本镜真实图片(work_dir 相对路径, 空=无图)", default = "" },
  { id = "imageCredit", type = "string", label = "本镜图片屏上署名(空=无图)", default = "" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]

[layouts.story]
composition_id = "np-story"
ground_hex = "#f5efe3"
ground_tone = "light"
variables = [
  { id = "kicker", type = "string", label = "眉标", default = "POLICY" },
  { id = "ordinal", type = "string", label = "壁纸序号", default = "02" },
  { id = "tone", type = "string", label = "地面明暗", default = "light" },
  { id = "title", type = "string", label = "领句(作者标题行)", default = "一条新规" },
  { id = "onscreen", type = "string", label = "屏句(唯一上屏整句, 不进配音)", default = "标准全国统一了" },
  { id = "slotSeconds", type = "number", label = "本镜可见秒数", default = 4, min = 1 },
]
